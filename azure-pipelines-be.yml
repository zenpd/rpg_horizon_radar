# Backend CI/CD — build image, push to ACR, deploy to Azure Container Apps.
trigger:
  branches: { include: [main] }
  paths:
    include:
      - app/**
      - azure-pipelines-be.yml
    exclude:
      - app/ui/**

variables:
  azureSubscription: 'Zenlabs-agent-foundry-connection'
  acrName: 'zafacr'
  acrLoginServer: 'zafacr-gqfyc3h8eya2djey.azurecr.io'
  resourceGroup: 'Zenlabs-Agent-Foundry'
  environmentName: 'zaf-aca-pvt-env'
  backendApp: 'rpg-horizon-radar-be'
  workerApp: 'rpg-horizon-radar-worker'
  backendRepo: 'rpg-horizon-radar-be'
  backendPort: '8040'
  tag: 'latest'
  # Only used the first time this pipeline creates the app/worker (az containerapp update never
  # changes env vars — see BOOTSTRAP_GUIDE.md). The connector/LLM *_KV_URI values are secrets:
  # define them in an Azure DevOps variable group (e.g. "rpg-horizon-radar-secrets") linked below,
  # never inline here. A blank *_KV_URI just leaves that connector disabled.
  commonEnv: >-
    APP_ENV=production LOG_LEVEL=INFO
    SCHEDULER_ENABLED=true INGEST_DAILY_AT=17:00 DISCOVERY_EVERY_DAYS=7 SWOT_EVERY_DAYS=7 OPPORTUNITY_DAILY_AT=08:00
    LLM_ROUTES=groq:openai/gpt-oss-120b,nvidia:nvidia/nemotron-3-super-120b-a12b
    GNEWS_API_KEY_KV_URI=$(gnewsApiKeyKvUri) NEWSDATA_API_KEY_KV_URI=$(newsdataApiKeyKvUri)
    TAVILY_API_KEY_KV_URI=$(tavilyApiKeyKvUri) ADZUNA_APP_ID_KV_URI=$(adzunaAppIdKvUri)
    ADZUNA_APP_KEY_KV_URI=$(adzunaAppKeyKvUri) FETCHLAYER_API_KEY_KV_URI=$(fetchlayerApiKeyKvUri)
    YOUTUBE_API_KEY_KV_URI=$(youtubeApiKeyKvUri) ALPHA_VANTAGE_API_KEY_KV_URI=$(alphaVantageApiKeyKvUri)
    EPO_OPS_CONSUMER_KEY_KV_URI=$(epoOpsConsumerKeyKvUri) EPO_OPS_CONSUMER_SECRET_KV_URI=$(epoOpsConsumerSecretKvUri)
    FINCRUX_API_KEY_KV_URI=$(fincruxApiKeyKvUri) GROQ_API_KEY_KV_URI=$(groqApiKeyKvUri) NVIDIA_API_KEY_KV_URI=$(nvidiaApiKeyKvUri)
    FIRST_USER_EMAIL=$(firstUserEmail) FIRST_USER_PASSWORD_KV_URI=$(firstUserPasswordKvUri)

# Define the KV_URI values referenced above in this group (Pipelines → Library) rather than here.
# variables:
#   - group: rpg-horizon-radar-secrets

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: BuildDeploy
    displayName: Build & Deploy Backend
    jobs:
      - job: BuildDeploy
        steps:
          - task: AzureCLI@2
            displayName: Build image (ACR) and deploy backend + worker
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                IMAGE="$(acrLoginServer)/$(backendRepo):$(tag)"

                echo "== Build & push =="
                az acr build --registry $(acrName) --image "$(backendRepo):$(tag)" \
                  --file app/Dockerfile app

                echo "== Deploy backend =="
                if az containerapp show -n $(backendApp) -g $(resourceGroup) >/dev/null 2>&1; then
                  az containerapp update -n $(backendApp) -g $(resourceGroup) --image "$IMAGE"
                else
                  az containerapp create -n $(backendApp) -g $(resourceGroup) \
                    --environment $(environmentName) --image "$IMAGE" \
                    --target-port $(backendPort) --ingress internal --allow-insecure \
                    --min-replicas 0 --max-replicas 3 --cpu 1 --memory 2Gi \
                    --registry-server $(acrLoginServer) \
                    --env-vars $(commonEnv)
                fi

                echo "== Deploy worker (same image) =="
                if az containerapp show -n $(workerApp) -g $(resourceGroup) >/dev/null 2>&1; then
                  az containerapp update -n $(workerApp) -g $(resourceGroup) --image "$IMAGE"
                else
                  az containerapp create -n $(workerApp) -g $(resourceGroup) \
                    --environment $(environmentName) --image "$IMAGE" --ingress none \
                    --min-replicas 1 --max-replicas 3 --cpu 0.5 --memory 1Gi \
                    --registry-server $(acrLoginServer) \
                    --command python -- -m workers.worker \
                    --env-vars $(commonEnv)
                fi
