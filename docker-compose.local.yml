version: "3.9"

# Minimal local dependencies (Postgres + Redis) for running the API/worker on
# the host. For the full stack (Temporal, Phoenix, containerised API/worker),
# use app/docker-compose.yml instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpg_horizon_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
