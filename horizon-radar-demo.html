<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --ink:#15201B; --muted:#56635C; --faint:#8A968F;
  --rule:#D9DFDA; --chip:#EAEFEB;
  --accent:#0E6E55; --accent-soft:#DDEFE8;
  --l1:#2C64A8; --l1s:#E2ECF7;
  --l2:#A5661A; --l2s:#F6EBDB;
  --l3:#2E7A48; --l3s:#E0F0E5;
  --l4:#6A4C9C; --l4s:#ECE5F5;
  --dim:.28;
  --crit:#B7372B; --crits:#F8E3E0; --high:#B8661A; --highs:#F7E9DA; --opp:#1E7F55; --opps:#DDF0E6; --watch:#3F68A3; --watchs:#E1EAF6;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#161E1A; --ink:#E6ECE8; --muted:#A3B0A9; --faint:#76837C;
    --rule:#2A3530; --chip:#212B26;
    --accent:#4FC39F; --accent-soft:#193A30;
    --l1:#7FB0EC; --l1s:#1A2A3E;
    --l2:#E3AA5E; --l2s:#35291A;
    --l3:#77CC92; --l3s:#1A3323;
    --l4:#B89BE6; --l4s:#2A2140;
    --dim:.22;
    --crit:#F08377; --crits:#3A1E1B; --high:#EBA560; --highs:#36291A; --opp:#6FD3A2; --opps:#17352A; --watch:#8DB2EA; --watchs:#1B2940;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#161E1A; --ink:#E6ECE8; --muted:#A3B0A9; --faint:#76837C;
  --rule:#2A3530; --chip:#212B26;
  --accent:#4FC39F; --accent-soft:#193A30;
  --l1:#7FB0EC; --l1s:#1A2A3E;
  --l2:#E3AA5E; --l2s:#35291A;
  --l3:#77CC92; --l3s:#1A3323;
  --l4:#B89BE6; --l4s:#2A2140;
  --dim:.22;
  --crit:#F08377; --crits:#3A1E1B; --high:#EBA560; --highs:#36291A; --opp:#6FD3A2; --opps:#17352A; --watch:#8DB2EA; --watchs:#1B2940;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
header{display:flex;flex-direction:column;gap:12px}
.side{border-right:1px solid var(--rule);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.lock{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;white-space:nowrap}
.crumb{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.03em}
.crumb b{color:var(--accent);font-weight:500}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;font-size:11.5px}
.fin-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.fin-search{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.fin-search input{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;max-width:320px}
.fin-search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fin-list{display:flex;flex-wrap:wrap;gap:6px}
.fin-list button{font:500 12px var(--body);color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:999px;padding:4px 10px;cursor:pointer}
.fin-list button[aria-selected="true"]{background:var(--l2s);border-color:var(--l2);color:var(--ink)}
.fin-list button:focus-visible,.fin-period button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fin-list small{color:var(--faint);font-size:11.5px;align-self:center}
.fin-period button{font:inherit;font-size:11.5px;padding:4px 11px;background:transparent;color:var(--muted);border:0;border-left:1px solid var(--rule);cursor:pointer}
.fin-period button:first-child{border-left:0}
.fin-period button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fin-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.fin-legend span{display:flex;align-items:center;gap:6px}
.fin-legend i{width:14px;height:3px;border-radius:2px;display:block}
.fin-legend b.up{color:var(--opp)} .fin-legend b.dn{color:var(--crit)}
.fin-chart text{fill:var(--faint);font-family:var(--mono);font-size:10px}
.fin-chart .lbl-ev{fill:var(--muted);font-family:var(--body);font-size:10.5px}
.fin-table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.fin-table th,.fin-table td{padding:6px 4px;border-top:1px solid var(--rule);text-align:right}
.fin-table th:first-child,.fin-table td:first-child{text-align:left;color:var(--muted);font-weight:400}
.fin-table thead th{border-top:0;font-size:11.5px;color:var(--faint);font-weight:600}
.side .sep{margin-top:auto;border-top:1px solid var(--rule);padding:10px 8px 0;font-size:11.5px;color:var(--faint)}
.am{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;gap:10px;align-items:center}
.pill{border:1px solid var(--rule);border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap}
.pill.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.am h4{font-family:var(--display);font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.am h5{font-family:var(--display);font-size:13.5px;margin:0 0 8px;font-weight:700}
.sub{color:var(--muted);margin:0}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
.panel{border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.sev{font-size:10.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:1px 6px;background:var(--svs);color:var(--sv);white-space:nowrap;align-self:start}
.crit{--sv:var(--crit);--svs:var(--crits)} .high{--sv:var(--high);--svs:var(--highs)}
.opp{--sv:var(--opp);--svs:var(--opps)} .watch{--sv:var(--watch);--svs:var(--watchs)}
.mini{font-size:11px;background:var(--chip);border-radius:4px;padding:0 6px;color:var(--muted)}
.tl{display:flex;flex-direction:column}
.tl div{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.tl div:first-child{border-top:0}
.tl time{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.tl p{margin:0}
.callout{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.callout b{font-family:var(--display)}
.callout p{margin:0}
.chart{color:var(--accent)}
.chart text{fill:var(--faint);font-family:var(--mono);font-size:9px}
.stack{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.prompt{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;gap:10px;align-items:center}
.prompt span{flex:1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:1px solid var(--rule);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opt.rec{box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt p{margin:0}
.rate{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-size:11.5px;color:var(--muted)}
.rate b{color:var(--ink);font-weight:600}
.chat{display:flex;flex-direction:column;gap:12px}
.q{align-self:flex-end;background:var(--ink);color:var(--bg);border-radius:12px 12px 2px 12px;padding:9px 12px;max-width:70%}
.a{border:1px solid var(--rule);border-radius:12px 12px 12px 2px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:88%}
.a ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.a sup{font-family:var(--mono);color:var(--accent);font-size:10px}
.src{display:flex;flex-direction:column;gap:6px}
.src div{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:12px}
.src span{font-family:var(--mono);color:var(--accent)}
.verified{font-size:11.5px;color:var(--opp);display:flex;gap:6px;align-items:center}
</style><style>
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;height:52px;font-variant-numeric:tabular-nums;background:var(--svs);color:var(--sv)}
.score b{font-family:var(--display);font-size:22px;line-height:1}
.score small{font-size:9.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.s-hi{--sv:var(--crit);--svs:var(--crits)} .s-md{--sv:var(--high);--svs:var(--highs)} .s-lo{--sv:var(--muted);--svs:var(--chip)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-top:1px solid var(--rule);vertical-align:top}
.tbl thead th{border-top:0;font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono)}
.tbl td.mono{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.toggle{display:inline-flex;width:30px;height:17px;border-radius:9px;background:var(--rule);position:relative;vertical-align:middle}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface)}
.toggle.on{background:var(--opp)} .toggle.on::after{left:15px}
</style>
<style>
body{padding:0;background:var(--bg)}
.am a{color:var(--accent)}
.shell-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
.laneseg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.laneseg button{font:600 13px var(--body);padding:6px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.laneseg button+button{border-left:1px solid var(--rule)}
.laneseg button[aria-pressed="true"].l1{background:#1E7F55;color:#fff}
.laneseg button[aria-pressed="true"].l2{background:#B4234F;color:#fff}
.laneseg button:focus-visible,.navbtn:focus-visible,.btnx:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topctl{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.topctl select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:5px 8px}
.mock{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;background:var(--chip);color:var(--muted);border-radius:4px;padding:2px 7px}
.spacer{flex:1}
.seg.dm button{font:600 12.5px var(--body);padding:6px 12px;background:var(--surface);color:var(--muted);border:0;border-left:1px solid var(--rule);cursor:pointer}
.seg.dm button:first-child{border-left:0}
.seg.dm button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.dm button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px)}
.shell .side{min-height:100%}
.navbtn{font:inherit;font-size:13px;text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted);background:transparent;border:0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%}
.navbtn:hover{background:var(--surface)}
.navbtn[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.navbtn em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint)}
.navbtn .newdot{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:#fff;border-radius:3px;padding:0 4px}
.shell .am{font-size:13.5px;line-height:1.5;padding:18px 22px 40px;max-width:1180px}
.view[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:14px}
.btnx{font:600 12.5px var(--body);border:1px solid var(--rule);border-radius:6px;padding:6px 11px;background:var(--surface);color:var(--ink);cursor:pointer}
.btnx:hover{border-color:var(--accent)}
.btnx.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btnx[disabled]{opacity:.45;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.filters select,.filters input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 8px}
.tabs2{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--rule)}
.tabs2 button{font:600 13px var(--body);background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer}
.tabs2 .newdot{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.navgrp{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 10px 4px}
.hbars{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.hbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;opacity:.8}
.hbars i.neg{background:var(--crit)}
.verdict{border-radius:10px;padding:12px 14px;background:var(--accent-soft)}
.verdict b{font-family:var(--display);font-size:15px}
.flagok{color:var(--opp)} .flagbad{color:var(--crit);font-weight:600}
.tabs2 button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:6px;padding:8px 10px}
.kv small{display:block;color:var(--faint);font-size:11px}
.kv b{font-size:13.5px}
.match{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pbar{height:7px;background:var(--chip);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.pbar i{display:block;height:100%;background:var(--accent)}
.crit{display:flex;flex-wrap:wrap;gap:6px}
.crit span{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--surface)}
.crit span.ok{border-color:var(--opp);color:var(--opp)} .crit span.no{border-color:var(--rule);color:var(--faint);text-decoration:line-through}
textarea.th{font:inherit;font-size:13.5px;width:100%;min-height:74px;border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink)}
.graphwrap{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
.graphwrap svg{display:block;min-width:720px;width:100%;height:auto}
.gl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.gl i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.frm label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.frm select,.frm input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
.pill2{font-size:11px;font-family:var(--mono);border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill2.fired{background:var(--crits);color:var(--crit)}
.empty2{border:1px dashed var(--rule);border-radius:8px;padding:16px;text-align:center;color:var(--faint)}
.barrow{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}

/* theme toggle */
#themeBtn{font-size:15px;line-height:1;padding:6px 10px}

/* Ask Radar: clickable suggestion chips + free-text input */
.askSug{all:unset;box-sizing:border-box;display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:12px;cursor:pointer;width:100%;padding:4px 2px;border-radius:6px}
.askSug:hover{background:var(--chip)}
.askSug:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.askSug span:first-child{font-family:var(--mono);color:var(--accent)}
.askSug span:last-child{color:var(--ink)}
#askInput{flex:1;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);min-width:0}
#askInput:focus-visible{outline:none}
.prompt:focus-within{border-color:var(--accent)}
.a.fallback{border-style:dashed}

/* escalated-move badge, sits next to the "Open follow-up" link */
.esc-badge{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--opps);color:var(--opp);border-radius:999px;padding:2px 9px;margin-right:6px}
.esc-badge.closed{background:var(--chip);color:var(--muted)}

/* scope note shown on single-company screens while "All companies" is selected */
.scope-note{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 10px;margin-top:6px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .shell .side{min-height:0;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--rule)}
  .shell .side .lbl,.shell .side .sep,.shell .side .navgrp{display:none}
  .navbtn{width:auto}
  .shell .am{padding:14px 16px 40px}
  .cols,.cols.even{grid-template-columns:1fr}
  .dgrid,.kpis{grid-template-columns:1fr 1fr}
}

/* ---- story layout ---- */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.pcol{background:var(--chip);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcol-h{display:flex;flex-direction:column;gap:1px;padding:2px 2px 4px}
.pcol-h b{font-family:var(--display);font-size:13.5px;display:flex;justify-content:space-between;align-items:baseline}
.pcol-h b em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.pcol-h small{font-size:11.5px;color:var(--muted)}
.pcol .empty2{font-size:12px;padding:12px 8px;background:transparent}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ccard p{margin:0;font-size:12.8px;line-height:1.4;font-weight:600;color:var(--ink)}

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const b=$("themeBtn");
  b.textContent = t==="dark" ? "☀︎" : "☾";
  b.setAttribute("aria-pressed", String(t==="dark"));
  b.setAttribute("aria-label", t==="dark" ? "Switch to light theme" : "Switch to dark theme");
  b.title = t==="dark" ? "Switch to light theme" : "Switch to dark theme";
}
let theme;
try{ theme = localStorage.getItem("hr-theme"); }catch(e){ theme = null; }
if(theme!=="light" && theme!=="dark"){
  theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
applyTheme(theme);
$("themeBtn").onclick=()=>{
  theme = theme==="dark" ? "light" : "dark";
  try{ localStorage.setItem("hr-theme", theme); }catch(e){}
  applyTheme(theme);
};

function sparkSVG(sp){
  const v=sp.v, hi=Math.max(...v), lo=Math.min(...v)>50?Math.floor(Math.min(...v)*0.98):0;
  const X=i=>16+175*i/(v.length-1), Y=x=>56-46*(x-lo)/((hi-lo)||1);
  const pts=v.map((x,i)=>`${X(i).toFixed(1)},${Y(x).toFixed(1)}`);
  return `<svg class="chart" viewBox="0 0 200 70" width="100%" role="img" aria-label="${esc(sp.t)}">
    <line x1="10" y1="56" x2="195" y2="56" stroke="var(--rule)" stroke-width="1"/><line x1="10" y1="10" x2="195" y2="10" stroke="var(--rule)" stroke-width=".6" stroke-dasharray="2 3"/>
    <text x="0" y="13">${hi}</text><text x="0" y="59">${lo}</text>
    <path d="M${pts.join(" L")} L${X(v.length-1)},56 L16,56 Z" fill="currentColor" opacity=".15"/>
    <path d="M${pts.join(" L")}" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="3.5" fill="currentColor"/>
    <text x="12" y="68">${esc(sp.a)}</text><text x="195" y="68" text-anchor="end">${esc(sp.b)}</text></svg>`;
}

const askThreads = {};
function askTurns(){
  if(!askThreads[cur]){
    const a=WS[cur].ask;

}
function askSuggestions(){
  const a=WS[cur].ask;

}
function matchAsk(co,qRaw){
  const q=qRaw.toLowerCase(), w=WS[co];
  const rivalNames=[w.rival,...Object.keys(w.fin.rivals)];
  const hitRival=rivalNames.find(n=>q.includes(n.toLowerCase()));
  if(hitRival){
    if(hitRival===w.rival){
      return {lead:`Here's the latest the radar has tracked on ${w.rival}:`,
        pts:[[`${w.timeline[0][0]} · ${w.timeline[0][1]}: ${w.timeline[0][2]}`,1],[w.analyst,2],[`Customers say: ${w.voc[0][2]} ${w.voc[0][3]}`,3]],
        mean:w.suggest, conf:78, src:[w.timeline[0][3],"Voice of Customer tracker","Analyst synthesis"]};
    }
    const r=w.fin.rivals[hitRival];
    return {lead:`On ${hitRival} (${r.seg}) versus ${w.listed?co:"the sector index"}:`,
      pts:[[`1-year share price return: ${pct(r.ret["1Y"])}`,1],[r.why,2],[r.act,3]],
      mean:r.act, conf:74, src:["Market & Financials Tracker","Exchange price data"]};
  }
  if(/\bscor(e|ing)\b|how.*(calculat|work)/.test(q)){
    const sample=TARGETS.filter(t=>t.desks.includes(co)).sort((a,b)=>b.score-a.score)[0]||TARGETS[0];
    return {lead:"Every opportunity score is rule-based, never a black box:",
      pts:[["Each distinct signal type carries a fixed weight — for example an insolvency filing is worth 35, a leadership departure 20.",1],
           ["The weights for every distinct type touching a company are summed, then multiplied by a co-occurrence factor (1.0× for one type, up to 2.0× for four or more).",2],
           [`For example, ${sample.name}: ${sample.types.map(k=>`${TYPE_LABEL[k].toLowerCase()} ${W[k]}`).join(" + ")} = ${sample.base}, × ${sample.m} → ${sample.score}.`,3],
           ["Scores are capped at 100 and never use non-public information.",1]],
      mean:"a higher score means more independent signal types are pointing the same way at once — not that any single signal is more important.", conf:95,
      src:["Radar scoring rules (fixed, shown to every user)","Signal weights table"]};
  }
  if(/\brisks?\b/.test(q)){
    const t=TARGETS.filter(x=>x.desks.includes(co)).sort((a,b)=>b.score-a.score)[0];
    const negV=w.voc.find(v=>v[0]==="crit")||w.voc[0];
    const pts=[[`${negV[2]} ${negV[3]}`,1]];
    if(t){const b=t.brief||makeBrief(t); pts.push([`On ${t.name}: ${b.cons[0]}`,2]); if(b.flags[0]!=="None found in public sources") pts.push([`Red flag on ${t.name}: ${b.flags[0]}`,3]);}
    return {lead:`The main risks the radar is watching around ${co} right now:`, pts,
      mean:"none of this is confirmed by diligence — treat it as a prompt to look closer, not a verdict.", conf:70,
      src:["Voice of Customer tracker","Public-signal pattern matching (no non-public information)"]};
  }
  const target=TARGETS.find(t=>q.includes(t.name.toLowerCase())||q.includes(t.name.split(" ")[0].toLowerCase()));
  if(target){
    return {lead:`${target.name} (${target.category}, ${target.geo}) — opportunity score ${target.score} of 100:`,
      pts:[[target.business,1],[`${target.signals[0][1]} · ${target.signals[0][2]}`,2],[`Routed to ${target.desks.join(", ")}.`,3]],
      mean:`current status: ${target.status.replace(/_/g," ")}.`, conf:82,
      src:[target.signals[0][3],"Radar scoring rules"]};
  }
  // generic: scan this company's own tracked rival timeline for topical overlap
  // (covers the app's own "Try asking" chips that don't name a rival directly,
  // e.g. "Which rivals are hiring for EV roles?")
  const stop=new Set(["which","what","where","when","how","does","has","have","been","that","this","with","from","about","rival","rivals","company","companies","the","and","for","are","is","in","on","of","to","its","their","doing"]);
  const words=q.replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(x=>x.length>3&&!stop.has(x));
  if(words.length){
    let best=null,bestScore=0;
    w.timeline.forEach(t=>{
      const hay=(t[1]+" "+t[2]).toLowerCase();
      const score=words.filter(word=>hay.includes(word)).length;
      if(score>bestScore){bestScore=score;best=t;}
    });
    if(best){
      return {lead:`Closest match from what the radar has tracked on ${w.rival}:`,
        pts:[[`${best[0]} · ${best[1]}: ${best[2]}`,1],[w.analyst,2]],
        mean:w.suggest, conf:62, src:[best[3],"Analyst synthesis"]};
    }
  }
  return null;
}
function askAsk(qRaw){
  const q=(qRaw||"").trim(); if(!q) return;

  list.push(hit?{q,...hit}:{q,fallback:true});
  renderAsk();
  const qs=$("wsAsk").querySelectorAll(".q"); const last=qs[qs.length-1];
  if(last) last.scrollIntoView({block:"end",behavior:"smooth"});
}
function renderAskTurn(t){

}
function renderAskFallback(t){

function renderAsk(){

  const note=scope==="All"?`<div><span class="scope-note">Showing ${esc(cur)} — pick a company above to change</span></div>`:"";

    ${note}
    ${list.map(t=>t.fallback?renderAskFallback(t):renderAskTurn(t)).join("")}
    <div class="prompt"><input type="text" id="askInput" placeholder="Ask a follow-up about ${esc(cur)}'s market…" autocomplete="off"><button type="button" class="btn" id="askSend">Send</button></div>
   </div>
   <div class="panel"><h5>Sources</h5><div class="src">${(srcTurn.src||WS[cur].ask.src).map((s,i)=>`<div><span>[${i+1}]</span><p style="margin:0">${esc(s)}</p></div>`).join("")}</div>
    <h5 style="margin-top:14px">Try asking</h5><div class="src">${askSuggestions().map(s=>`<button type="button" class="askSug" data-q="${esc(s)}"><span>→</span><span>${esc(s)}</span></button>`).join("")}</div></div>
  </div>`;
  const input=$("askInput"), send=$("askSend");

  send.onclick=submit;
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit();}});

}

const PERIODS={"1M":{n:22,lab:["4 wks ago","3 wks","2 wks","1 wk","Today"]},"6M":{n:26,lab:["Apr","May","Jun","Jul","Aug","Sep"]},"1Y":{n:52,lab:["Oct '25","Jan '26","Apr '26","Jul '26","Sep '26"]},"3Y":{n:36,lab:["2023","2024","2025","2026"]}};
const FROWS=["P/E","EV / EBITDA","Revenue growth (YoY)","EBITDA margin","Net debt / EBITDA","Analysts: buy · hold · sell"];
let fsel=null, per="1Y";
function rng(seed){let a=0;for(const c of seed)a=(a*31+c.charCodeAt(0))|0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function series(key,c){const {n}=PERIODS[per], r=rng(key+per), tgt=c.ret[per];let w=0;const nz=[0];
  for(let i=1;i<=n;i++){w+=(r()-.5)*2*c.vol*(per==="1M"?1.2:2.2);nz.push(w);}
  return nz.map((v,i)=>100*(1+tgt/100*i/n)+v-nz[n]*i/n);}
function baseName(){const f=WS[cur].fin;return f.listed?cur:f.baseName;}
function draw(){
  const f=WS[cur].fin, c=f.rivals[fsel], a=series(cur,f.base), b=series(fsel,c), bn=baseName();
  const all=a.concat(b); let lo=Math.min(...all), hi=Math.max(...all); const step=(hi-lo)>80?40:(hi-lo)>40?20:(hi-lo)>16?10:5;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const L=40,R=630,T=16,B=230, X=i=>L+(R-L)*i/(a.length-1), Y=v=>B-(B-T)*(v-lo)/(hi-lo);
  let g="";
  for(let v=lo;v<=hi+.001;v+=step){g+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="${v===100?1.2:.6}" ${v===100?'':'stroke-dasharray="2 4"'}/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;}
  const labs=PERIODS[per].lab; labs.forEach((t,i)=>{const x=L+(R-L)*i/(labs.length-1);g+=`<text x="${x}" y="${B+18}" text-anchor="${i===0?'start':i===labs.length-1?'end':'middle'}">${t}</text>`;});
  const path=s=>s.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const ei=Math.round(c.ev[0]*(b.length-1)), ex=X(ei), ey=Y(b[ei]), up=ey>T+30, ty=up?ey-22:ey+28;
  g+=`<path d="${path(b)}" fill="none" stroke="var(--l2)" stroke-width="2"/><path d="${path(a)}" fill="none" stroke="var(--accent)" stroke-width="2.4" ${f.listed?'':'stroke-dasharray="6 4"'}/>`;
  g+=`<circle cx="${X(a.length-1)}" cy="${Y(a[a.length-1])}" r="4" fill="var(--accent)"/><circle cx="${X(b.length-1)}" cy="${Y(b[b.length-1])}" r="4" fill="var(--l2)"/>`;
  g+=`<line x1="${ex}" x2="${ex}" y1="${ey}" y2="${up?ty+4:ty-12}" stroke="var(--l2)" stroke-width="1"/><circle cx="${ex}" cy="${ey}" r="3.5" fill="var(--surface)" stroke="var(--l2)" stroke-width="1.5"/><text class="lbl-ev" x="${Math.min(Math.max(ex,L+60),R-60)}" y="${ty}" text-anchor="middle">${esc(c.ev[1])}</text>`;
  $("finChart").innerHTML=g;
  const ra=a[a.length-1]-100, rb=b[b.length-1]-100;
  $("finLegend").innerHTML=`<span><i style="background:var(--accent)"></i>${esc(bn)} <b class="${ra>=0?'up':'dn'}">${pct(ra)}</b></span><span><i style="background:var(--l2)"></i>${esc(fsel)} <b class="${rb>=0?'up':'dn'}">${pct(rb)}</b></span><span style="color:var(--faint)">over ${per}</span>`;
  const gap=rb-ra;
  $("finNote").innerHTML=`<b>Why the gap? · Market &amp; Financials Tracker</b><p>Over ${per}, ${esc(fsel)} ${gap>=0?"outperformed":"underperformed"} ${f.listed?esc(cur):"the sector index"} by ${Math.abs(gap).toFixed(1)} points. ${esc(c.why)}</p><p><b style="font-family:var(--body)">So what for ${esc(cur)}:</b> ${esc(c.act)}</p>`;
  $("finTable").innerHTML=`<thead><tr><th>Metric</th><th>${f.listed?esc(cur):"Sector median"}</th><th>${esc(fsel)}</th></tr></thead><tbody>`+FROWS.map((r,i)=>`<tr><td>${r}</td><td>${f.base.m[i]}</td><td>${c.m[i]}</td></tr>`).join("")+"</tbody>";
}
function finList(){

function makeBrief(t){
  const pros=[],cons=[],flags=[];
  if(t.types.some(k=>["credit_downgrade","delayed_filing","insolvency_filed","pledge_rising"].includes(k))) pros.push("Possible distress-driven opening. The owners may be open to talks.");
  if(t.types.includes("succession_risk")) pros.push("Succession gap may make the family open to a sale.");
  if(t.types.includes("pe_exit_window")||t.types.includes("divestment_signal")) pros.push("Owner is likely looking for an exit or buyer.");
  if(t.types.includes("patent_shift")||t.types.includes("press_opportunity")) pros.push("Growing capability that fills a gap for "+t.desks.join(", ")+".");
  pros.push("Found through public sources ahead of wide market awareness.");
  cons.push("Not confirmed by diligence. These are patterns in public data, not verified financials.");
  if(t.desks.length>1) cons.push("Relevant to several RPG companies. Agree which one would own it.");
  if(t.bidders.length) cons.push("Rival interest detected. Timing may be tight.");
  if(t.types.includes("insolvency_filed")) cons.push("In an insolvency process. Any bid goes through the resolution process.");
  if(t.types.includes("auditor_resigned")) flags.push("Auditor resigned");
  if(t.pledge>30) flags.push(`Promoter pledge ${t.pledge}%`);
  if(t.types.includes("delayed_filing")) flags.push("Late filing");
  if(t.rating==="D"||t.types.includes("credit_downgrade")) flags.push(`Rating ${t.rating}`);
  if(t.types.includes("insolvency_filed")) flags.push("Insolvency case open");
  if(!flags.length) flags.push("None found in public sources");
  const complexity = t.geo!=="India"||t.desks.length>1?"High":t.listed?"Medium":"Low";
  const cci = t.revenue>1000?"Check needed with Legal":"Likely not needed · confirm";
  return {pros,cons,flags,complexity,cci};
}

/* ---- Ownership graph (SVG) ---- */
function graphSVG(t){
  const W0=1000,H0=470,cx=430,cy=250,nodes=[],edges=[];
  const col={family:"#1E7F55",pe:"#6A4C9C",public:"#8A968F",person:"#2C64A8",link:"#B7372B",sub:"#A5661A"};
  const spread=(n,gap,c)=>Array.from({length:n},(_,i)=>c+(i-(n-1)/2)*gap);
  spread(t.owners.length,86,cy).forEach((y,i)=>{const o=t.owners[i];nodes.push({x:130,y,label:o[0],sub:"owns "+o[1]+"%",kind:o[2]});edges.push([nodes.length-1,o[1]+"%"]);});
  const dys=spread(t.directors.length,96,cy);
  t.directors.forEach((d,i)=>{const di=nodes.length;nodes.push({x:680,y:dys[i],label:d[0],sub:d[1],kind:"person"});edges.push([di,"director"]);
    spread(d[2].length,44,dys[i]).forEach((y,j)=>nodes.push({x:890,y,label:d[2][j],sub:"also on this board",kind:"link",from:di}));});
  spread(t.subs.length,240,cx).forEach((x,i)=>{nodes.push({x,y:60,label:t.subs[i],sub:"subsidiary",kind:"sub"});edges.push([nodes.length-1,"owns"]);});
  const F='font-family="Arial,sans-serif"';
  let s=`<div class="graphwrap"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Ownership and relationship map for ${esc(t.name)}">`;
  edges.forEach(([i,l])=>{const n=nodes[i];const mx=cx+(n.x-cx)*0.62,my=cy+(n.y-cy)*0.62;s+=`<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="#8A968F" stroke-width="1.4"/><rect x="${mx-30}" y="${my-9}" width="60" height="16" rx="3" fill="#FFFFFF"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="10.5" fill="#56635C" ${F}>${esc(l)}</text>`;});
  nodes.forEach(n=>{if(n.kind==="link"){const f=nodes[n.from];s+=`<line x1="${f.x}" y1="${f.y}" x2="${n.x}" y2="${n.y}" stroke="#B7372B" stroke-width="1.5" stroke-dasharray="5 4"/>`;}});
  s+=`<rect x="${cx-115}" y="${cy-27}" width="230" height="54" rx="8" fill="#FBE3EA" stroke="#B4234F" stroke-width="2"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" font-weight="700" fill="#15201B" ${F}>${esc(t.name.length>32?t.name.slice(0,30)+"…":t.name)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="#56635C" ${F}>Target · score ${t.score}</text>`;
  nodes.forEach(n=>{const w=n.kind==="link"?180:200;const c=col[n.kind];const lab=n.label.length>28?n.label.slice(0,26)+"…":n.label;
    s+=`<rect x="${n.x-w/2}" y="${n.y-20}" width="${w}" height="40" rx="${n.kind==="person"?20:6}" fill="#FFFFFF" stroke="${c}" stroke-width="1.8"/><text x="${n.x}" y="${n.y-3}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15201B" ${F}>${esc(lab)}</text><text x="${n.x}" y="${n.y+12}" text-anchor="middle" font-size="10.5" fill="${c}" ${F}>${esc(n.sub)}</text>`;});
  s+=`</svg></div>`;
  const links=t.directors.filter(d=>d[2].length);
  if(links.length) s+=`<div class="callout"><b>Links found</b><p>${links.map(d=>`${esc(d[0])} (${esc(d[1])}) also sits on: ${d[2].map(esc).join(", ")}.`).join(" ")}</p></div>`;
  return s;
}

function parseThesis(txt){ // mock of the LLM step
  const l=txt.toLowerCase(),c={sector:[],geo:[],rev:[0,99999],own:[]};
  if(/tyre|tire|rubber compound/.test(l))c.sector.push("tyres"); if(/epc|substation|transmission/.test(l))c.sector.push("epc");
  if(/\bai\b|analytics|software|it services/.test(l))c.sector.push("it"); if(/pharma|api|formulation/.test(l))c.sector.push("pharma");
  if(/cable|heat-shrink|joint|electrical/.test(l))c.sector.push("electrical"); if(/tea|estate|plantation/.test(l))c.sector.push("plantations");
  if(/sensor|iot/.test(l))c.sector.push("sensors"); if(!c.sector.length)c.sector.push("tyres");
  ["India","ASEAN","Middle East","US","UK"].forEach(g=>{if(l.includes(g.toLowerCase()))c.geo.push(g);}); if(!c.geo.length)c.geo.push("India");
  const m=txt.replace(/,/g,"").match(/(\d+)\s*[–-]\s*(\d+)/); if(m)c.rev=[Number(m[1]),Number(m[2])];
  if(/family/.test(l))c.own.push("family"); if(/promoter/.test(l))c.own.push("promoter"); if(/\bpe\b|private equity/.test(l))c.own.push("pe"); if(/founder/.test(l))c.own.push("founder");
  return c;
}

function verdictOf(t,h){
  const last=h.m[4], fall=h.m[0]-last;
  const run = fall>=4 || h.aud[0]==="bad" && !/not yet filed/.test(h.aud[1]);
  const fund = h.de>3 || (h.ic!==null && h.ic<2) || t.pledge>30;
  if(h.early) return ["Early stage","Revenue is growing fast and it has only just turned profitable. Too early to call it weak; it may need funding to keep growing."];
  if(run&&fund) return ["Badly run and badly funded","Margins are falling and debt is heavy. A buyer would need to fix both the business and the balance sheet. Usually a turnaround or insolvency-process purchase."];
  if(fund) return ["Badly funded, business is sound","Margins are holding up, but debt or pledged shares are too high. The core business may be worth more to an owner with a stronger balance sheet."];
  if(run) return ["Badly run, balance sheet is fine","Debt is manageable, but margins are sliding or the auditor has raised concerns. A buyer would need to fix operations and governance."];
  return ["Healthy","Stable margins and low debt. Any deal would come from the owner wanting to sell, not from distress."];
}
function hbars(vals,fmt){const mx=Math.max(...vals.map(Math.abs))||1;return `<div class="hbars">${vals.map((v,i)=>`<div><span>${fmt(v)}</span><i class="${v<0?"neg":""}" style="height:${Math.max(3,Math.abs(v)/mx*62)}px"></i><span>${YRS[i]}</span></div>`).join("")}</div>`;}

function planFor(c){
  if(c.kind==="deal"){const o=SCEN[c.t.id].a.opts;const r=["Days 0–30","Days 31–60","Days 61–90"];
    const p=o.slice(0,3).map((x,i)=>({when:r[i],what:x[0]==="Escalate for evaluation"?"Decide on a bid":x[0],how:x[1]}));
    if(p.length<3)p.push({when:r[p.length],what:"Decide the next step",how:"Formal bid, partnership or stop, based on diligence."});return p;}
  const o=c.w.war.opts;return [{when:"Days 0–30",what:o[0][1],how:o[0][2]},{when:"Days 31–60",what:o[1][1],how:o[1][2]},{when:"Days 61–90",what:"Review against the rival's moves",how:`Compare results with ${c.w.rival}'s actual moves and adjust.`}];
}
function ownersFor(c){return c.kind==="deal"?[`Head of Strategy, ${c.co}`,`CFO, ${c.co}`,"Group M&A team"]:[`Head of Strategy, ${c.co}`,`Business head, ${c.co}`,`Sales head, ${c.co}`];}
function watchFor(c){
  if(c.kind==="deal"){const t=c.t,r=SCEN[t.id].rival;return [`Any new stake disclosure (SAST) in ${t.name}`,`Rating change or late filing by ${t.name}`,`Any deal move by ${r}`];}
  return [`New product launches or plant filings by ${c.w.rival}`,`${c.w.rival} price changes in ${c.co}'s markets`,`Customer complaints about ${c.w.rival} (Voice of Customer)`];
}

function coverHTML(){const cs=bookCases();
  return `<article class="doc page"><header class="doc-h"><span class="eb">Deep-dive book · Week 40 · written ${TODAY}</span><h3>${cs.length} compan${cs.length>1?"ies":"y"} for decision</h3><p>Escalated by ${esc(scope==="All"?"Group strategy":scope+" strategy team")} · prepared by 7 agents · each page is fixed once written</p></header>
   <section><h5>Contents</h5><div class="toc">${cs.map((c,i)=>`<button class="tocrow" data-pg="${i+1}"><span class="mono">p. ${i+2}</span><span><b>${esc(who(c))}</b> <span class="kchip ${c.kind}">${c.kind==="deal"?"Target":"Rival"}</span><br><span class="sub">${esc(c.title)}</span></span><span class="sub" style="text-align:right">Recommends: ${esc(recOf(c))}<br><b>${esc(c.stage==="decide"?"Decision pending":c.owner?"Approved":c.outcome||"")}</b></span></button>`).join("")}</div></section>
   <section><h5>How to read this book</h5><p>Each page covers one company: what happened, why it matters, what could happen, the risks and a 90-day plan. Every page ends with a decision. The last page lists all decisions.</p></section>
   <div class="btnrow"><button class="btnx pri" data-pg="1">Start reading</button></div></article>`;}
function decisionsHTML(){const cs=bookCases();
  return `<article class="doc page"><header class="doc-h"><span class="eb">Deep-dive book · last page</span><h3>Decisions</h3><p>${cs.filter(c=>c.stage!=="decide").length} of ${cs.length} decided</p></header>
   <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Company</th><th>Recommendation</th><th>Decision</th><th>Owner</th></tr></thead><tbody>${cs.map((c,i)=>`<tr><td><a href="#" data-pg="${i+1}">${esc(who(c))}</a></td><td>${esc(recOf(c))}</td><td>${c.stage==="decide"?'<span class="pill2 fired">Pending</span>':esc(c.owner?"Approved":c.outcome||"")}</td><td>${esc(c.owner||"–")}</td></tr>`).join("")}</tbody></table></div>
   ${followCases().some(c=>c.inBook)?`<div class="btnrow"><button class="btnx pri" id="toFollow">Go to follow-up</button></div>`:""}</article>`;}
function rBook(){
  const N=pagesCount();
  if(!N){$("v-book").innerHTML=`<div><span class="crumb"><b>Deep-dive book</b></span><h4>No pages yet</h4></div>${journeyHTML()}<div class="empty2" style="padding:28px">Shortlist companies on <b>This week</b> and escalate them. Agents then write one page per company here.<div class="btnrow" style="justify-content:center;margin-top:12px"><button class="btnx pri" id="toHome">Go to This week</button></div></div>`;$("toHome").onclick=()=>show("home");return;}
  bookPage=Math.max(0,Math.min(bookPage,N-1));
  const cs=bookCases(), c=bookPage>=1&&bookPage<=cs.length?cs[bookPage-1]:null;
  const body=bookPage===0?coverHTML():c?(c.kind==="deal"?ovDeal(c):ovThreat(c)).replace('<article class="doc">','<article class="doc page">').replace('</header>','</header>'+whyBox(c)):decisionsHTML();
  const tabs=[["Cover",0]].concat(cs.map((x,i)=>[who(x),i+1])).concat([["Decisions",N-1]]);
  $("v-book").innerHTML=`<div><span class="crumb"><b>Deep-dive book</b> · Week 40</span><h4>${cs.length} compan${cs.length>1?"ies":"y"} · one page each</h4></div>
   ${journeyHTML()}
   <div class="booknav"><button class="btnx" id="bkPrev"${bookPage===0?" disabled":""}>← Previous</button><div class="bktabs">${tabs.map(([l,i])=>`<button type="button" data-pg="${i}" aria-current="${i===bookPage?"page":"false"}">${esc(l)}${i>=1&&i<=cs.length&&cs[i-1].stage==="decide"?' <i class="dot"></i>':""}</button>`).join("")}</div><button class="btnx" id="bkNext"${bookPage===N-1?" disabled":""}>Next →</button></div>
   <div class="pagewrap turn">${body}<div class="pgno">Page ${bookPage+1} of ${N}</div></div>
   <div class="booknav bottom"><button class="btnx" id="bkPrev2"${bookPage===0?" disabled":""}>← Previous</button><span class="sub">Tip: use the ← → keys to turn pages</span><button class="btnx pri" id="bkNext2"${bookPage===N-1?" disabled":""}>Next page →</button></div>`;
  const go=p=>{bookPage=p;rBook();window.scrollTo(0,0);renderGuide();};
  $("v-book").querySelectorAll("[data-pg]").forEach(b=>b.onclick=e=>{e.preventDefault();go(Number(b.dataset.pg));});
  ["bkPrev","bkPrev2"].forEach(id=>$(id).onclick=()=>go(bookPage-1)); ["bkNext","bkNext2"].forEach(id=>$(id).onclick=()=>go(bookPage+1));
  const tf=$("toFollow"); if(tf) tf.onclick=()=>show("follow");
  if(c) bindDecision(c);
}
function whyBox(c){const r=recForCase(c.id); if(!r) return "";
  return `<div class="whybox"><small>Why this is in the book · from ${esc(r.co)}'s SWOT</small><b>${esc(r.title)}</b><div class="uses">${r.uses.map(u=>`<span class="u${u[0]}">${u}</span> <span class="sub" style="font-size:12.5px">${esc(swotItem(r.co,u))}</span>`).join("<br>")}</div></div>`;}
function bindDecision(c){
  const on=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};
  const done=msg=>{toast(msg);rBook();renderNav();renderGuide();};
  on("cApprove",()=>{c.owner=$("cOwner").value;c.approved=TODAY;c.stage="act";c.plan=planFor(c).map(p=>({...p,done:false}));audit("approve",who(c)+" · owner "+c.owner);done(`Approved. ${who(c)} moves to Follow-up with ${c.owner}.`);});
  on("cPark",()=>{c.stage="closed";c.outcome="Parked for 90 days";audit("park",who(c));done("Parked. It comes back in 90 days or on a new signal.");});
  on("cReject",()=>{c.stage="closed";c.outcome="Rejected";audit("reject",who(c));done("Rejected.");});
  on("cCopy",()=>{const txt=`${who(c)}: ${c.title}\n${$("v-book").querySelector(".reco")?.innerText||""}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Summary copied.")).catch(()=>toast("Copy isn't available here. Select the text instead."));});
}
document.addEventListener("keydown",e=>{if(view!=="book"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;const N=pagesCount();
  if(e.key==="ArrowRight"&&bookPage<N-1){bookPage++;rBook();window.scrollTo(0,0);renderGuide();} if(e.key==="ArrowLeft"&&bookPage>0){bookPage--;rBook();window.scrollTo(0,0);renderGuide();}});

/* ---------- 5. Follow-up ---------- */
function rFollow(){
  const fs=followCases().filter(inScope);
  if(!fs.length){$("v-follow").innerHTML=`<div><span class="crumb"><b>Follow-up</b></span><h4>Nothing to follow up yet</h4></div>${journeyHTML()}<div class="empty2" style="padding:28px">Approve a page in the deep-dive book and it appears here with its plan and watch rules.</div>`;return;}
  if(!fs.find(c=>c.id===followSel)) followSel=fs[fs.length-1].id;
  const c=caseById(followSel);
  $("v-follow").innerHTML=`<div><span class="crumb"><b>Follow-up</b> · ${fs.length} approved</span><h4>Plans, watch rules and outcomes</h4><p class="sub">Each approved company has an owner, a 90-day plan and automatic watch rules. New signals land here after every daily run.</p></div>
   ${journeyHTML()}
   <div class="kfilter" role="tablist" aria-label="Approved companies">${fs.map(x=>`<button type="button" role="tab" data-fs="${esc(x.id)}" aria-pressed="${x.id===followSel}">${esc(who(x))}${x.stage==="closed"?" · closed":""}</button>`).join("")}</div>
   <div class="top"><div><h4 style="font-size:17px">${esc(who(c))} · ${esc(c.title)}</h4><p class="sub">${kindLabel(c)} · for ${esc(coLabel(c))} · <a href="#" id="fBook">${c.inBook?"Read its book page":"Approved from an earlier book"}</a></p></div></div>
   ${trackHTML(c)}`;
  $("v-follow").querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{followSel=b.dataset.fs;rFollow();});
  $("fBook").onclick=e=>{e.preventDefault();if(c.inBook)openBookAt(c.id);};
  const on=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};
  on("cWeek",()=>{c.updates.forEach(u=>u[2]=false);const d=["6 Oct","13 Oct","20 Oct","27 Oct"][Math.min(c.upNext,3)];c.updates.unshift([d,nextUpdate(c),true]);audit("weekly_run",who(c));toast("Next week's run added an update.");rFollow();});
  on("cWon",()=>{c.stage="closed";c.outcome="Acted on it";audit("outcome",who(c)+" · acted");toast("Outcome saved.");rFollow();renderNav();renderGuide();});
  on("cDrop",()=>{c.stage="closed";c.outcome="Dropped after follow-up";audit("outcome",who(c)+" · dropped");toast("Outcome saved.");rFollow();renderNav();renderGuide();});
  $("v-follow").querySelectorAll("[data-pl]").forEach(x=>x.onchange=()=>{c.plan[x.dataset.pl].done=x.checked;audit("plan_step",c.plan[x.dataset.pl].what);rFollow();});
}

/* ---------- guided demo ---------- */
function renderGuide(){
  const g=$("guide"); g.hidden=!guideOn; document.body.classList.toggle("guide-on",guideOn); $("guideBtn").setAttribute("aria-pressed",String(guideOn)); if(!guideOn) return;
  const pending=bookCases().filter(c=>c.stage==="decide"), newFollow=followCases().filter(c=>c.inBook);
  let n,title,text,go=null;
  if(deepIds.some(id=>caseById(id).stage==="deep")){n=3;title="Deep dive";text="Agents are writing one page per shortlisted company. Only these companies get the paid data and deeper research.";go=view!=="deep"?["Watch progress",()=>show("deep")]:null;}
  else if(shortlist.size){n=2;title="Escalate";text=`${shortlist.size} shortlisted. Add up to 5, then press Escalate in the bar at the bottom.`;go=view!=="home"?["Back to This week",()=>show("home")]:null;}
  else if(pending.length){n=4;title="Read the book";text="One page per company, like a book. Turn pages with Next or the arrow keys. Each page ends with a decision: approve with an owner, park or reject.";go=view!=="book"?["Open the book",()=>show("book")]:null;}
  else if(newFollow.length&&!newFollow.every(c=>c.stage==="closed")){n=5;title="Follow up";text="Approved companies get a tracked plan and watch rules. Tick a step, press 'Simulate next week's run', then record the outcome.";go=view!=="follow"?["Open follow-up",()=>show("follow")]:null;}
  else if(bookOrder.length){n=5;title="That's the full story";text="From the week's signals to a shortlist, a book of decisions and follow-up. Restart to try it with other companies.";}
  else {n=1;title="Start with the SWOT";text="Each RPG company's SWOT is rebuilt from the signals. Only moves that link a strength or weakness to an opportunity or threat are recommended. Hover a move to see its SWOT items, then tick Shortlist on 2 or 3.";go=view!=="home"?["Go to This week",()=>show("home")]:null;}
  g.innerHTML=`<small>Guided demo · step ${n} of 5</small><div class="gdots">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><b>${esc(title)}</b><p>${esc(text)}</p>
   <div class="gb">${go?`<button class="pri" id="gGo">${esc(go[0])}</button>`:""}<button id="gRestart">Restart</button><button id="gHide">Hide guide</button></div>`;
  if(go) $("gGo").onclick=go[1];
  $("gRestart").onclick=()=>{clearInterval(deepTimer);shortlist.clear();bookOrder=[];bookPage=0;deepIds=[];followSel=null;buildCases();$("coSel").value="CEAT";setCompany("CEAT");kindF="all";show("home");};
  $("gHide").onclick=()=>{guideOn=false;renderGuide();};
}
$("guideBtn").onclick=()=>{guideOn=!guideOn;renderGuide();};
$("coSel").onchange=e=>{setCompany(e.target.value); show(view==="deep"?"deep":view);};

/* ---------- boot ---------- */
buildCases(); $("coSel").value="CEAT"; setCompany("CEAT"); show("home");
</script>

</body>
</html>
