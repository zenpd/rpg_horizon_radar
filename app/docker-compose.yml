version: "3.9"

services:
  # ── Application API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8040:8040"
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/rpg_horizon_radar
      - PHOENIX_HOST=phoenix
    depends_on: [postgres, redis, temporal, phoenix]
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8040 --reload

  # ── Temporal worker (same image, command override) ───────────────────────────
  worker:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/rpg_horizon_radar
      - PHOENIX_HOST=phoenix
    depends_on:
      temporal: { condition: service_healthy }
      phoenix: { condition: service_started }
    restart: on-failure
    command: python -m workers.worker

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpg_horizon_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=postgres
      - DEFAULT_NAMESPACE=rpg-horizon-radar
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic-config.yaml
    volumes:
      - ./config/temporal/dynamic-config.yaml:/etc/temporal/dynamic-config.yaml:ro
    depends_on: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe rpg-horizon-radar --address $(hostname -i | awk '{print $1}'):7233 >/dev/null 2>&1 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_CORS_ORIGINS=http://localhost:8080
      - TEMPORAL_UI_DEFAULT_NAMESPACE=rpg-horizon-radar
    depends_on: [temporal]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

volumes:
  pgdata:
